name: Saudi HR Quality

on:
  push:
    branches:
      - version-15
      - version-16
  pull_request:
    branches:
      - version-15
      - version-16

jobs:
  quality:
    name: Cross-version dependency and legal-rule checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify importable base dependencies
        run: |
          python - <<'PY'
          import openlocationcode
          import openpyxl

          print("base dependencies ok")
          PY

      - name: Validate Saudi HR release contract
        run: python scripts/validate_quality.py

      - name: Check Python quality
        run: ruff check saudi_hr --select F

      - name: Check JavaScript syntax
        run: find saudi_hr -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Compile Python sources
        run: python -m compileall -q saudi_hr

